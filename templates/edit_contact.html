{% extends "base.html" %}
{% block title %}Edit Contact - Engineering Portfolio{% endblock %}

{% block content %}
<section class="add-project">
    <h2>Edit Contact Info</h2>

    <form method="POST" action="{{ url_for('edit_contact') }}" class="project-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ contact.email }}" placeholder="you@example.com">

        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone" value="{{ contact.phone }}" placeholder="+61 4XX XXX XXX">

        <label for="linkedin">LinkedIn URL</label>
        <input type="url" id="linkedin" name="linkedin" value="{{ contact.linkedin }}" placeholder="https://linkedin.com/in/yourprofile">

        <label for="github">GitHub URL</label>
        <input type="url" id="github" name="github" value="{{ contact.github }}" placeholder="https://github.com/yourusername">

        <button type="submit" class="btn">Save Changes</button>
    </form>

    <a href="{{ url_for('contact') }}" class="btn btn-secondary">Cancel</a>
</section>
{% endblock %}
